name: Build and deploy

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate portfolio data
        run: npm run data
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_GH_TOKEN }}
          PORTFOLIO_DENYLIST: ${{ secrets.PORTFOLIO_DENYLIST }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub disables scheduled workflows after 60 days without repo activity.
      - name: Keep the daily schedule enabled
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
